<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mashibye Tours - Booking</title>

    <link rel="stylesheet" href="my css style.css">
    <script src="j.s index.txt"></script>
</head>
<!-- BOOKING -->
        <section id="booking">

            <h2>Book Your Shuttle</h2>

            <form>

                <label for="name">Full Name:</label>
                <input type="text"
                       id="name"
                       name="name">

                <br><br>


                <label for="email">Email:</label>
                <input type="email"
                       id="email"
                       name="email">

                <br><br>


                <label for="phone">Phone Number:</label>
                <input type="tel"
                       id="phone"
                       name="phone">

                <br><br>


                <label for="pickup">
                    Pickup Location:
                </label>

                <input type="text"
                       id="pickup"
                       name="pickup">

                <br><br>


                <label for="destination">
                    Drop-off Location:
                </label>

                <input type="text"
                       id="destination"
                       name="destination">

                <br><br>


                <label for="date">Travel Date:</label>

                <input type="date"
                       id="date"
                       name="date">

                <br><br>


                <label for="time">Travel Time:</label>

                <input type="time"
                       id="time"
                       name="time">

                <br><br>


                <label for="passengers">
                    Number of Passengers:
                </label>

                <input type="number"
                       id="passengers"
                       name="passengers"
                       min="1">

                <br><br>


                <label for="vehicle">
                    Vehicle Type:
                </label>

                <select id="vehicle"
                        name="vehicle">

                    <option value="standard">
                        Standard Shuttle
                    </option>

                    <option value="minibus">
                        Minibus
                    </option>

                    <option value="luxury">
                        Luxury Vehicle
                    </option>

                </select>

                <br><br>

                <button type="submit">
                    Submit Booking
                </button>

            </form>

        </section>
